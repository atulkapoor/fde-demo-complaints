name: ci
on:
  push:
  pull_request:
    # Fork PRs never receive repository variables here, so no
    # endpoint inside the network is reachable from a stranger's
    # branch; the model-free lanes still run for them.
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e . pytest

      # The deliverable's own tests: the contract, the fence, the
      # harness's refusal of an empty exam, and every promise the
      # HTTP edge makes, asserted against the booted service --
      # model-free, seconds.
      - name: Smoke and edge
        run: python -m pytest -q tests/
      # Gating on tests alone measures whether the code runs, not
      # whether it is right. The evaluation is the one that says so --
      # and it prints every layer, adversarial included, so scoring
      # well on golden and badly on adversarial is visible in this
      # step's own output rather than averaged away.
      - name: Evaluate
        run: python evals/harness.py --min-score 0.0 --report harness-report.json
      # Every layer and every failure, kept beside the run -- the
      # console shows the first few; a regression is diffed from here.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: harness-report.json
          if-no-files-found: ignore
